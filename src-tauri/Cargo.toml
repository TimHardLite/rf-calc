[package]
name = "dn-calc"
version = "1.0.0-beta.1"
description = "Калькулятор диаграмм направленности антенн ИРТ"
authors = ["ИРТ"]
edition = "2021"

[lib]
name = "dn_calc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
