name: Validate and build web
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run docs:check
      - uses: actions/upload-artifact@v4
        with:
          name: rf-calc-web
          path: dist/
          if-no-files-found: error
